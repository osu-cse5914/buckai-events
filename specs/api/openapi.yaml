openapi: 3.0.3
info:
  title: Social OSU API
  version: 1.0.0
  description: |
    REST API for Social OSU, an AI-powered campus discovery platform for The Ohio State University students.
    Aggregates on-campus and off-campus events, supports a student-only gig marketplace, delivers
    personalized recommendations, and provides an agentic LLM chatbot for event discovery.

    Authentication is handled via Clerk (restricted to @osu.edu and @buckeyemail.osu.edu).
    All endpoints require a valid Clerk JWT in the Authorization header.
    Successful responses return resources directly. Paginated responses return `{ items, meta }`.
    Error responses use RFC 7807 Problem Details (`application/problem+json`).

servers:
  - url: https://social-osu.workers.dev/api/v1
    description: Production
  - url: http://localhost:3001/api/v1
    description: Local development

tags:
  - name: Users
    description: User profile management and user-scoped relationship endpoints
  - name: Admin
    description: Admin-only operational endpoints
  - name: Social
    description: Social feed endpoints
  - name: Events
    description: Event CRUD, listing, and filtering
  - name: Gigs
    description: Gig application endpoints
  - name: Collections
    description: Save/bookmark events into named collections
  - name: Interactions
    description: Implicit user signal tracking for recommendations
  - name: Recommendations
    description: Personalized event/gig feed
  - name: Conversations
    description: Chatbot conversation and message history

security:
  - bearerAuth: []

paths:
  # ──────────────────────────────────────────────
  # Users
  # ──────────────────────────────────────────────
  /users/me:
    get:
      tags: [Users]
      summary: Get authenticated user's profile
      operationId: getCurrentUser
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/external-ingestion/sync:
    post:
      tags: [Admin]
      summary: Trigger a synchronous external event sync
      operationId: triggerExternalEventSync
      responses:
        '200':
          description: External sync summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_ExternalSyncSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Users]
      summary: Update profile fields
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get public profile of a user
      operationId: getPublicProfile
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_PublicProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/follow:
    post:
      tags: [Users]
      summary: Follow a user
      operationId: followUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '201':
          description: Follow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Follow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [Users]
      summary: Unfollow a user
      operationId: unfollowUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Unfollowed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/followers:
    get:
      tags: [Users]
      summary: List a user's followers
      operationId: listFollowers
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated follower list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_PublicProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/following:
    get:
      tags: [Users]
      summary: List users that a user follows
      operationId: listFollowing
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated following list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_PublicProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────
  # Social Feed
  # ──────────────────────────────────────────────
  /social/feed:
    get:
      tags: [Social]
      summary: Get events from followed users
      operationId: getSocialFeed
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated social feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_SocialFeedItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ──────────────────────────────────────────────
  # Events
  # ──────────────────────────────────────────────
  /events:
    get:
      tags: [Events]
      summary: List events with filters
      operationId: listEvents
      parameters:
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/EventType'
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: source
          schema:
            $ref: '#/components/schemas/EventSource'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/EventStatus'
        - $ref: '#/components/parameters/EventUser'
        - in: query
          name: search
          description: Full-text search on title and description
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_Event'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Events]
      summary: Create an event or gig
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /events/{eventId}:
    get:
      tags: [Events]
      summary: Get single event with full detail
      operationId: getEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Events]
      summary: Update event (owner only; forbidden for external events)
      operationId: updateEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Events]
      summary: Delete event (owner only; forbidden for external events)
      operationId: deleteEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '204':
          description: Event deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────
  # Gig Applications
  # ──────────────────────────────────────────────
  #needs further functionality to get a specific gig application, and also more functionality for submitting an application to a gig such as adding relevant fields
  /gigs/{gigId}/applications:
    post:
      tags: [Gigs]
      summary: Apply to a gig
      description: |
        gigId is an Event ID. The system validates that the event has type = GIG.
        Returns 400 if the event is not a gig. Returns 403 if the user owns the gig.
      operationId: createApplication
      parameters:
        - $ref: '#/components/parameters/GigId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      tags: [Gigs]
      summary: List applications for a gig
      description: Gig owner sees all applications. Applicant sees only their own.
      operationId: listApplications
      parameters:
        - $ref: '#/components/parameters/GigId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated application list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_Application'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /gigs/{gigId}/applications/{appId}:
    patch:
      tags: [Gigs]
      summary: Update application status (gig owner only)
      operationId: updateApplication
      parameters:
        - $ref: '#/components/parameters/GigId'
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: Application updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────
  # Collections
  # ──────────────────────────────────────────────
  /collections:
    get:
      tags: [Collections]
      summary: List authenticated user's collections
      operationId: listCollections
      responses:
        '200':
          description: User's collections ordered by updatedAt descending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_CollectionArray'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Collections]
      summary: Create a collection
      operationId: createCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: Collection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Collection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /collections/{collectionId}:
    get:
      tags: [Collections]
      summary: Get collection with items (respects visibility)
      operationId: getCollection
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '200':
          description: Collection with items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_CollectionWithItems'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Collections]
      summary: Update collection (owner only)
      operationId: updateCollection
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionRequest'
      responses:
        '200':
          description: Collection updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Collection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Collections]
      summary: Delete collection and all items (owner only)
      operationId: deleteCollection
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '204':
          description: Collection deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /collections/{collectionId}/items:
    get:
      tags: [Collections]
      summary: List events in a collection
      operationId: listCollectionItems
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated events in collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Collections]
      summary: Add event to collection
      operationId: addCollectionItem
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId:
                  type: string
      responses:
        '201':
          description: Event added to collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_CollectionItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /collections/{collectionId}/items/{eventId}:
    delete:
      tags: [Collections]
      summary: Remove event from collection
      operationId: removeCollectionItem
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '204':
          description: Event removed from collection
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────
  # Interactions
  # ──────────────────────────────────────────────
  /interactions:
    post:
      tags: [Interactions]
      summary: Record a user interaction
      operationId: createInteraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInteractionRequest'
      responses:
        '201':
          description: Interaction recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Interaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────
  # Recommendations
  # ──────────────────────────────────────────────
  /recommendations:
    get:
      tags: [Recommendations]
      summary: Get personalized event/gig feed
      operationId: getRecommendations
      parameters:
        - in: query
          name: type
          description: Filter by EVENT or GIG. Omit for blended feed.
          schema:
            $ref: '#/components/schemas/EventType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Personalized feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_Event'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ──────────────────────────────────────────────
  # Conversations
  # ──────────────────────────────────────────────
  /conversations:
    get:
      tags: [Conversations]
      summary: List user's conversations
      operationId: listConversations
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Conversations ordered by updatedAt descending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Conversations]
      summary: Create a new conversation
      operationId: createConversation
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /conversations/{conversationId}/messages:
    get:
      tags: [Conversations]
      summary: Get message history
      operationId: listMessages
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Messages ordered by createdAt ascending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Conversations]
      summary: Send a message; returns streamed LLM response
      description: |
        Sends a user message and returns the chatbot's response via SSE streaming.
        The Content-Type of the response is text/event-stream.
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Streamed SSE response
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

# ════════════════════════════════════════════════
# Components
# ════════════════════════════════════════════════
components:
  # ── Parameters ────────────────────────────────
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string

    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string

    GigId:
      name: gigId
      in: path
      required: true
      description: An Event ID. System validates the event has type = GIG.
      schema:
        type: string

    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string

    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string

    EventUser:
      name: user
      in: query
      description: Filter events to those created by the specified user ID.
      schema:
        type: string

    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string


    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  # ── Schemas ───────────────────────────────────
  schemas:
    # ── Enums ──
    EventType:
      type: string
      enum: [EVENT, GIG]

    EventSource:
      type: string
      enum: [OSU_API, TICKETMASTER, USER]

    UserRole:
      type: string
      enum: [USER, ADMIN]

    EventStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, COMPLETED, CANCELLED]

    AppStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED]

    InteractionType:
      type: string
      enum: [VIEW, SAVE, CLICK, APPLY, DISMISS]

    MessageRole:
      type: string
      enum: [USER, ASSISTANT, SYSTEM]

    CollectionVisibility:
      type: string
      enum: [PRIVATE, PUBLIC]

    CompensationType:
      type: string
      enum: [FIXED, HOURLY]


    # ── Value Objects ──
    Location:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 500
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    Compensation:
      type: object
      required: [amount, type]
      properties:
        amount:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          default: USD
        type:
          $ref: '#/components/schemas/CompensationType'

    # ── Pagination Meta ──
    PaginationMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer

    # ── Entity Schemas ──
    User:
      type: object
      required: [id, clerkId, email, role, interests, followerCount, followingCount, createdAt, updatedAt]
      properties:
        id:
          type: string
        clerkId:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        displayName:
          type: string
          maxLength: 100
          nullable: true
        major:
          type: string
          maxLength: 100
          nullable: true
        gradYear:
          type: integer
          minimum: 2000
          maximum: 2100
          nullable: true
        interests:
          type: array
          items:
            type: string
        followerCount:
          type: integer
          minimum: 0
        followingCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PublicProfile:
      type: object
      required: [id, interests, followerCount, followingCount, isFollowing, createdAt]
      properties:
        id:
          type: string
        displayName:
          type: string
          nullable: true
        major:
          type: string
          nullable: true
        gradYear:
          type: integer
          nullable: true
        interests:
          type: array
          items:
            type: string
        followerCount:
          type: integer
        followingCount:
          type: integer
        isFollowing:
          type: boolean
          description: Whether the authenticated user follows this user
        createdEvents:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          description: User's OPEN and IN_PROGRESS events
        createdAt:
          type: string
          format: date-time

    Event:
      type: object
      required: [id, title, description, type, source, location, startAt, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        summary:
          type: string
          maxLength: 500
          nullable: true
        type:
          $ref: '#/components/schemas/EventType'
        source:
          $ref: '#/components/schemas/EventSource'
        externalId:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
        imageUrl:
          type: string
          format: uri
          nullable: true
        ticketUrl:
          type: string
          format: uri
          nullable: true
        location:
          $ref: '#/components/schemas/Location'
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
          nullable: true
        compensation:
          allOf:
            - $ref: '#/components/schemas/Compensation'
          nullable: true
        status:
          $ref: '#/components/schemas/EventStatus'
        creatorId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Application:
      type: object
      required: [id, gigId, applicantId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        gigId:
          type: string
        applicantId:
          type: string
        message:
          type: string
          maxLength: 1000
          nullable: true
        status:
          $ref: '#/components/schemas/AppStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Collection:
      type: object
      required: [id, userId, name, visibility, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
          maxLength: 100
        visibility:
          $ref: '#/components/schemas/CollectionVisibility'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CollectionWithItems:
      allOf:
        - $ref: '#/components/schemas/Collection'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Event'

    CollectionItem:
      type: object
      required: [id, collectionId, eventId, createdAt]
      properties:
        id:
          type: string
        collectionId:
          type: string
        eventId:
          type: string
        createdAt:
          type: string
          format: date-time

    Interaction:
      type: object
      required: [id, userId, eventId, action, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        eventId:
          type: string
        action:
          $ref: '#/components/schemas/InteractionType'
        createdAt:
          type: string
          format: date-time

    Conversation:
      type: object
      required: [id, userId, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        title:
          type: string
          maxLength: 200
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Message:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        role:
          $ref: '#/components/schemas/MessageRole'
        content:
          type: string
          maxLength: 10000
        createdAt:
          type: string
          format: date-time


    Follow:
      type: object
      required: [id, followerId, followeeId, createdAt]
      properties:
        id:
          type: string
        followerId:
          type: string
        followeeId:
          type: string
        createdAt:
          type: string
          format: date-time

    SocialFeedItem:
      type: object
      required: [event, action, actor, actionAt]
      properties:
        event:
          $ref: '#/components/schemas/Event'
        action:
          type: string
          enum: [created, saved]
        actor:
          type: object
          required: [id, displayName]
          properties:
            id:
              type: string
            displayName:
              type: string
              nullable: true
        actionAt:
          type: string
          format: date-time

    # ── Request Schemas ──
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 100
        major:
          type: string
          maxLength: 100
        gradYear:
          type: integer
          minimum: 2000
          maximum: 2100
        interests:
          type: array
          items:
            type: string
      additionalProperties: false

    CreateEventRequest:
      type: object
      required: [title, description, type, location, startAt]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        type:
          $ref: '#/components/schemas/EventType'
        location:
          $ref: '#/components/schemas/Location'
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        compensation:
          $ref: '#/components/schemas/Compensation'
        category:
          type: string
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
        imageUrl:
          type: string
          format: uri
      additionalProperties: false

    UpdateEventRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        location:
          $ref: '#/components/schemas/Location'
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        compensation:
          $ref: '#/components/schemas/Compensation'
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        imageUrl:
          type: string
          format: uri
        status:
          $ref: '#/components/schemas/EventStatus'
      additionalProperties: false

    CreateApplicationRequest:
      type: object
      properties:
        message:
          type: string
          maxLength: 1000
      additionalProperties: false

    UpdateApplicationRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACCEPTED, REJECTED]
      additionalProperties: false

    CreateCollectionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        visibility:
          $ref: '#/components/schemas/CollectionVisibility'
      additionalProperties: false

    UpdateCollectionRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 100
        visibility:
          $ref: '#/components/schemas/CollectionVisibility'
      additionalProperties: false

    CreateInteractionRequest:
      type: object
      required: [eventId, action]
      properties:
        eventId:
          type: string
        action:
          $ref: '#/components/schemas/InteractionType'
      additionalProperties: false

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 10000
      additionalProperties: false

    ExternalSyncSourceSummary:
      type: object
      required: [fetched, created, updated, skipped, completed]
      properties:
        fetched:
          type: integer
          minimum: 0
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0

    ExternalSyncSummary:
      type: object
      required: [startedAt, finishedAt, sources]
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        sources:
          type: object
          required: [osu, ticketmaster]
          properties:
            osu:
              $ref: '#/components/schemas/ExternalSyncSourceSummary'
            ticketmaster:
              $ref: '#/components/schemas/ExternalSyncSourceSummary'

    # ── Response Shapes ──
    SuccessResponse_User:
      allOf:
        - $ref: '#/components/schemas/User'

    SuccessResponse_PublicProfile:
      allOf:
        - $ref: '#/components/schemas/PublicProfile'

    SuccessResponse_ExternalSyncSummary:
      allOf:
        - $ref: '#/components/schemas/ExternalSyncSummary'

    SuccessResponse_Event:
      allOf:
        - $ref: '#/components/schemas/Event'

    SuccessResponse_Application:
      allOf:
        - $ref: '#/components/schemas/Application'

    SuccessResponse_Collection:
      allOf:
        - $ref: '#/components/schemas/Collection'

    SuccessResponse_CollectionWithItems:
      allOf:
        - $ref: '#/components/schemas/CollectionWithItems'

    SuccessResponse_CollectionArray:
      type: array
      items:
        $ref: '#/components/schemas/Collection'

    SuccessResponse_CollectionItem:
      allOf:
        - $ref: '#/components/schemas/CollectionItem'

    SuccessResponse_Interaction:
      allOf:
        - $ref: '#/components/schemas/Interaction'

    SuccessResponse_Conversation:
      allOf:
        - $ref: '#/components/schemas/Conversation'

    SuccessResponse_Follow:
      allOf:
        - $ref: '#/components/schemas/Follow'


    PaginatedResponse_Event:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedResponse_Application:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Application'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedResponse_PublicProfile:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicProfile'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedResponse_SocialFeedItem:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SocialFeedItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedResponse_Conversation:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedResponse_Message:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        meta:
          $ref: '#/components/schemas/PaginationMeta'


    # ── Error (RFC 7807 Problem Details) ──
    ErrorResponse:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
      additionalProperties: true

  # ── Responses ─────────────────────────────────
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Not allowed to perform this action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Duplicate resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ── Security ──────────────────────────────────
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk-issued JWT. Restricted to @osu.edu and @buckeyemail.osu.edu accounts.
