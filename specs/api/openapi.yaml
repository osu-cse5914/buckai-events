openapi: 3.0.3
info:
  title: Social OSU API
  version: 1.0.0
  description: |
    REST API for Social OSU, an AI-powered campus discovery platform for The Ohio State University students.

    Authenticated application endpoints are exposed under `/api/v1` and require a valid Clerk JWT in the
    `Authorization` header unless noted otherwise. `GET /api/health` is intentionally unauthenticated.

    Most list endpoints return `{ data, pagination }`. Route-specific exceptions are documented inline, such as
    the embedded `createdEvents` page on public profiles, recommendation section responses shaped as `{ items, meta }`,
    and the admin pipeline job list.

servers:
  - url: https://social-osu.workers.dev
    description: Production
  - url: http://localhost:3001
    description: Local development

tags:
  - name: System
    description: Operational system endpoints
  - name: Auth
    description: Authenticated request-context endpoints
  - name: Users
    description: User profile and user-scoped endpoints
  - name: Admin
    description: Admin-only operational endpoints
  - name: Social
    description: Social feed endpoints
  - name: Events
    description: Event CRUD, listing, and semantic search
  - name: Gigs
    description: Gig application endpoints
  - name: Collections
    description: Save/bookmark events into named collections
  - name: Interactions
    description: Implicit user signal tracking
  - name: Recommendations
    description: Featured recommendation section endpoints
  - name: Conversations
    description: Chatbot message streaming endpoints

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [System]
      summary: Get API health
      operationId: getApiHealth
      security: []
      responses:
        '200':
          description: API health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get authenticated request-context user
      operationId: getAuthenticatedContextUser
      responses:
        '200':
          description: Authenticated user attached by middleware
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get authenticated user's profile
      operationId: getCurrentUser
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update authenticated user's profile
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatchRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/me/applications:
    get:
      tags: [Users]
      summary: List the authenticated user's gig applications
      operationId: listCurrentUserApplications
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated application history with gig summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMyApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get a user's public profile
      operationId: getPublicProfile
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Public profile with embedded created-events page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/{id}/follow:
    post:
      tags: [Users]
      summary: Follow another user
      operationId: followUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '201':
          description: Follow relationship created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Users]
      summary: Unfollow a user
      operationId: unfollowUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Follow relationship removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/{id}/followers:
    get:
      tags: [Users]
      summary: List follower profiles for a user
      operationId: listFollowers
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated follower profiles ordered by follow time descending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFollowProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/{id}/following:
    get:
      tags: [Users]
      summary: List profiles followed by a user
      operationId: listFollowing
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated followed-user profiles ordered by follow time descending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFollowProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/external-ingestion/sync:
    post:
      tags: [Admin]
      summary: Trigger a synchronous external event sync
      operationId: triggerExternalEventSync
      responses:
        '200':
          description: External sync summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSyncSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/ai-pipeline/jobs:
    get:
      tags: [Admin]
      summary: List recent AI pipeline jobs
      operationId: listAiPipelineJobs
      parameters:
        - $ref: '#/components/parameters/AdminJobsLimit'
      responses:
        '200':
          description: Recent AI pipeline jobs ordered by createdAt descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPipelineJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/ai-pipeline/events/{eventId}/rerun:
    post:
      tags: [Admin]
      summary: Queue an AI pipeline rerun for a single event
      operationId: rerunAiPipelineForEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiPipelineRerunRequest'
      responses:
        '202':
          description: Queued pipeline job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPipelineJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/ai-pipeline/backfill:
    post:
      tags: [Admin]
      summary: Queue an embedding backfill job
      operationId: createEmbeddingBackfillJob
      responses:
        '202':
          description: Queued backfill job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPipelineJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/social/feed:
    get:
      tags: [Social]
      summary: Get the social feed from followed users
      operationId: getSocialFeed
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated social feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSocialFeedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/events:
    get:
      tags: [Events]
      summary: List events
      operationId: listEvents
      parameters:
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/EventType'
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
        - in: query
          name: endDate
          schema:
            type: string
        - in: query
          name: source
          schema:
            $ref: '#/components/schemas/EventSource'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/EventStatus'
        - in: query
          name: statusMode
          schema:
            $ref: '#/components/schemas/EventStatusMode'
        - in: query
          name: user
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort
          schema:
            $ref: '#/components/schemas/EventSort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Events]
      summary: Create an event or gig
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: Created event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/events/semantic-search:
    get:
      tags: [Events]
      summary: Search future active events semantically
      operationId: semanticSearchEvents
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/EventType'
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated semantic search results using the standard event list envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/events/{eventId}:
    get:
      tags: [Events]
      summary: Get a single event
      operationId: getEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Events]
      summary: Update an owned event
      operationId: updateEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Events]
      summary: Delete an owned event
      operationId: deleteEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteEventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/gigs/{gigId}/applications:
    get:
      tags: [Gigs]
      summary: List applications for a gig
      operationId: listGigApplications
      parameters:
        - $ref: '#/components/parameters/GigId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated applications visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGigApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Gigs]
      summary: Apply to a gig
      operationId: applyToGig
      parameters:
        - $ref: '#/components/parameters/GigId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GigApplicationRequest'
      responses:
        '201':
          description: Created application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GigApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/gigs/{gigId}/applications/{appId}:
    patch:
      tags: [Gigs]
      summary: Update gig application status
      operationId: updateGigApplicationStatus
      parameters:
        - $ref: '#/components/parameters/GigId'
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GigApplicationStatusRequest'
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GigApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/collections:
    get:
      tags: [Collections]
      summary: List the authenticated user's collections
      operationId: listCollections
      responses:
        '200':
          description: Collection summaries ordered by updatedAt descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Collections]
      summary: Create a collection
      operationId: createCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreateRequest'
      responses:
        '201':
          description: Created collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/collections/{collectionId}:
    get:
      tags: [Collections]
      summary: Get a collection visible to the caller
      operationId: getCollection
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '200':
          description: Collection with collection items and expanded events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionWithItems'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Collections]
      summary: Update an owned collection
      operationId: updateCollection
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionPatchRequest'
      responses:
        '200':
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Collections]
      summary: Delete an owned collection
      operationId: deleteCollection
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '204':
          description: Collection deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/collections/{collectionId}/items:
    post:
      tags: [Collections]
      summary: Add an event to a collection
      operationId: addCollectionItem
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionItemCreateRequest'
      responses:
        '201':
          description: Created collection item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/collections/{collectionId}/items/{eventId}:
    delete:
      tags: [Collections]
      summary: Remove an event from a collection
      operationId: removeCollectionItem
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '204':
          description: Collection item deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/interactions:
    post:
      tags: [Interactions]
      summary: Record a user interaction
      operationId: createInteraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInteractionRequest'
      responses:
        '201':
          description: Recorded interaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────
  # Recommendations
  # ──────────────────────────────────────────────
  /api/v1/recommendations:
    get:
      tags: [Recommendations]
      summary: Get the Recommended Featured feed section
      operationId: getRecommendations
      parameters:
        - in: query
          name: type
          description: Filter by EVENT or GIG. Omit for blended feed.
          schema:
            $ref: '#/components/schemas/EventType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Recommended feed section
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/recommendations/popular:
    get:
      tags: [Recommendations]
      summary: Get the Popular Featured preview section
      operationId: getPopularRecommendations
      parameters:
        - in: query
          name: type
          description: Filter by EVENT or GIG. Omit for blended section results.
          schema:
            $ref: '#/components/schemas/EventType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Popular recommendation section
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationSectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/recommendations/upcoming:
    get:
      tags: [Recommendations]
      summary: Get the Upcoming Featured preview section
      operationId: getUpcomingRecommendations
      parameters:
        - in: query
          name: type
          description: Filter by EVENT or GIG. Omit for blended section results.
          schema:
            $ref: '#/components/schemas/EventType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Upcoming recommendation section
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationSectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ──────────────────────────────────────────────
  # Conversations
  # ──────────────────────────────────────────────
  /api/v1/conversations/{conversationId}/messages:
    post:
      tags: [Conversations]
      summary: Send a message to an existing conversation
      operationId: sendConversationMessage
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Streamed server-sent-event response
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string

    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string

    GigId:
      name: gigId
      in: path
      required: true
      description: Event ID validated to have `type = GIG`
      schema:
        type: string

    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string

    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string

