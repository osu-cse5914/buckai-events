name: Milestone Regression

on:
  milestone:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/social_osu_app?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run db:generate

      - name: Extract phase number from milestone title
        id: phase
        run: |
          TITLE="${{ github.event.milestone.title }}"
          PHASE=$(echo "$TITLE" | grep -oP 'Phase \K[0-9]+')
          echo "number=$PHASE" >> $GITHUB_OUTPUT

      - name: Run automated regression suite
        run: bun run test:regression:phase-${{ steps.phase.outputs.number }}

      - name: Create manual test checklist issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const phase = '${{ steps.phase.outputs.number }}';
            const milestoneTitle = '${{ github.event.milestone.title }}';

            let checklist = '';
            try {
              const content = fs.readFileSync(
                `test-cases/regression/phase-${phase}.md`, 'utf8'
              );
              const manualSection = content.split('## Manual checklist')[1];
              if (manualSection) {
                checklist = manualSection.trim();
              }
            } catch (e) {
              checklist = 'No regression checklist found for this phase.';
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Manual Regression Testing: ${milestoneTitle}`,
              body: [
                `## Manual Regression — ${milestoneTitle}`,
                '',
                `Automated regression passed. Complete the manual checklist below.`,
                '',
                checklist,
                '',
                '---',
                `Generated automatically on milestone close.`,
              ].join('\n'),
              labels: ['regression', 'manual-testing'],
            });
