name: Milestone Regression

on:
  milestone:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/social_osu_app?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run db:generate

      - name: Extract phase number from milestone title
        id: phase
        run: |
          TITLE="${{ github.event.milestone.title }}"
          PHASE=$(echo "$TITLE" | grep -oP 'Phase \K[0-9]+')
          echo "number=$PHASE" >> $GITHUB_OUTPUT

      - name: Run automated regression suite
        run: bun run test:regression:phase-${{ steps.phase.outputs.number }}

      - name: Generate manual test issue body
        id: manual
        run: |
          BODY=$(bun scripts/generate-regression-issue.ts ${{ steps.phase.outputs.number }} "${{ github.event.milestone.title }}")
          # Write to file to avoid shell escaping issues
          echo "$BODY" > /tmp/regression-body.md

      - name: Create manual test issue
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/regression-body.md', 'utf8');
            const milestoneTitle = '${{ github.event.milestone.title }}';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Manual Regression Testing: ${milestoneTitle}`,
              body,
              labels: ['regression', 'manual-testing'],
            });
