name: Test
description: Add or improve test coverage.
title: "[Test] "
labels: ["type:test"]
body:
  - type: input
    id: spec
    attributes:
      label: Spec File
      description: "Path to the spec with behaviors to test (e.g., specs/system/data-model.md)"
      placeholder: "specs/system/data-model.md"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What test coverage is needed? Reference specific spec behaviors."
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: "Concrete criteria for completion."
      value: |
        - [ ] Tests cover all spec behaviors listed
        - [ ] Tests follow TDD red-green workflow
        - [ ] All tests passing
        - [ ] No lint or typecheck errors
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - API
        - Web
        - Full-stack
    validations:
      required: true
