main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# DATABASE_URL, CLERK_SECRET_KEY, TICKETMASTER_API_KEY, and
# GOOGLE_GENERATIVE_AI_API_KEY are stored as encrypted secrets.
# Set them once after login:
#   wrangler secret put DATABASE_URL
#   wrangler secret put CLERK_SECRET_KEY
#   wrangler secret put TICKETMASTER_API_KEY
#   wrangler secret put GOOGLE_GENERATIVE_AI_API_KEY

[triggers]
crons = ["*/15 * * * *", "0 */6 * * *"]

[vars]
CLERK_PUBLISHABLE_KEY = "pk_test_ZHJpdmVuLWVhZ2xlLTI2LmNsZXJrLmFjY291bnRzLmRldiQ"
