name = "social-osu"
account_id = "2b7085f62464ab452fbd1c9569cedaef"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# DATABASE_URL, CLERK_SECRET_KEY, TICKETMASTER_API_KEY,
# CF_AIG_TOKEN, AI_ROUTER_CONFIG_JSON, and any additional provider secrets
# referenced by your router config are stored as encrypted secrets when used.
# Set the required secrets once after login:
#   wrangler secret put DATABASE_URL
#   wrangler secret put CLERK_SECRET_KEY
#   wrangler secret put TICKETMASTER_API_KEY
#   wrangler secret put CF_AIG_TOKEN
#   wrangler secret put AI_ROUTER_CONFIG_JSON
#
# For any additional provider entry, set the secret named by its apiKeyEnvVar.
# Example:
#   wrangler secret put OPENAI_PRIMARY_API_KEY

[triggers]
crons = ["*/15 * * * *", "0 */6 * * *"]

[vars]
CLERK_PUBLISHABLE_KEY = "pk_test_ZHJpdmVuLWVhZ2xlLTI2LmNsZXJrLmFjY291bnRzLmRldiQ"
